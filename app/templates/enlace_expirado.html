<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlace Expirado - Kolegium</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #191c1e;
        }
        .expired-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        .icon-container {
            width: 80px;
            height: 80px;
            background-color: #fef2f2;
            color: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .description {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="expired-card">
        <div class="icon-container">
            <i data-lucide="shield-alert" style="width: 40px; height: 40px;"></i>
        </div>
        <h1 class="title">Enlace Expirado</h1>
        <p class="description">
            Por motivos de seguridad, este enlace de acceso al expediente ya fue utilizado o ha sido revocado. 
            <br><br>
            Si necesitas ver esta información, por favor solicita un nuevo enlace a la institución.
        </p>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
