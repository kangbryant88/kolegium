{% extends 'base.html' %}

{% block content %}
<div class="mx-auto" style="max-width: 600px; margin-top: 50px;">
    <div class="table-card text-center" style="padding: 60px 20px;">
        <i data-lucide="wrench" style="width: 72px; height: 72px; color: var(--primary); margin-bottom: 24px;"></i>
        <h2 style="font-weight: 800; color: var(--on-surface); margin-bottom: 16px;">Módulo en Diseño</h2>
        <p style="color: var(--on-surface-variant); font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px;">
            Este módulo está siendo diseñado actualmente y pronto estará disponible en el sistema. 
        </p>
        <a href="/" class="btn-auth" style="display: inline-flex; align-items: center; justify-content: center; width: auto; padding: 12px 24px; text-decoration: none;">
            <i data-lucide="arrow-left" style="margin-right: 8px;"></i> Volver al Inicio
        </a>
    </div>
</div>
{% endblock %}
