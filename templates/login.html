<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolegium | Acceso al Sistema</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --bg-color: #050505;
            --text-color: #ffffff;
            --card-bg: #121212;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(120% 100% at top right, rgba(88, 28, 135, 0.15) 0%, var(--bg-color) 60%);
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .text-gradient {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 2.5rem;
        }

        .brand-logo .logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-logo .logo-icon i {
            color: #fff;
            font-size: 1.5rem;
        }

        .brand-logo span {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .login-card h2 {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .login-card .subtitle {
            text-align: center;
            color: #a1a1aa;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .field-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a1a1aa;
            margin-bottom: 8px;
            display: block;
        }

        .edu-input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.03);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            transition: all 0.3s ease;
            outline: none;
        }

        .edu-input:focus {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .edu-input::placeholder {
            color: #52525b;
        }

        .input-group-edu {
            position: relative;
            display: flex;
            align-items: center;
        }

        .toggle-pw {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: #a1a1aa;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-pw:hover {
            color: var(--text-color);
        }

        .toggle-pw i {
            font-size: 1.2rem;
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 0.75rem;
            background: var(--primary-gradient);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
            margin-top: 1rem;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .link-register {
            color: #8b5cf6;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .link-register:hover {
            color: #a78bfa;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">
            <img src="{{ url_for('static', filename='img/logo_kolegium.png') }}" alt="Logo Kolegium" style="width: 48px; height: 48px; object-fit: contain;">
            <span>Kolegium</span>
        </div>

        <h2>Bienvenido de nuevo</h2>
        <p class="subtitle">Ingresa tus credenciales para acceder al sistema.</p>

        {% if error %}
        <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="field-label">Usuario</label>
                <input type="text" name="username" class="edu-input" placeholder="Tu nombre de usuario" required autofocus>
            </div>

            <div class="mb-4">
                <label class="field-label">Contraseña</label>
                <div class="input-group-edu">
                    <input type="password" name="password" id="passwordInput" class="edu-input" placeholder="••••••••" required>
                    <button class="toggle-pw" type="button" id="togglePassword" title="Mostrar contraseña">
                        <i class="ph-bold ph-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">Acceder al Sistema</button>
            
            <div class="text-center mt-3">
                <a href="{{ url_for('index') }}" class="text-muted small text-decoration-none">
                    <i class="ph-bold ph-arrow-left"></i> Volver a la página principal
                </a>
            </div>
        </form>

        <div class="mt-4 text-center" style="font-size: 0.85rem; color: #a1a1aa;">
            ¿No tienes cuenta? <a href="/registro" class="link-register">Regístrate aquí</a>
        </div>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#passwordInput');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = this.querySelector('i');
            if (type === 'text') {
                icon.classList.remove('ph-eye');
                icon.classList.add('ph-eye-slash');
            } else {
                icon.classList.remove('ph-eye-slash');
                icon.classList.add('ph-eye');
            }
        });
    </script>
</body>
</html>
