<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolegium | Nueva Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --bg-color: #050505;
            --text-color: #ffffff;
            --card-bg: #121212;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(120% 100% at top right, rgba(88, 28, 135, 0.15) 0%, var(--bg-color) 60%);
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .reset-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            padding: 3rem 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 2.5rem;
        }

        .brand-logo span {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .reset-card h2 {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .reset-card .subtitle {
            text-align: center;
            color: #a1a1aa;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .field-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a1a1aa;
            margin-bottom: 8px;
            display: block;
        }

        .edu-input {
            width: 100%;
            padding: 0.85rem 1rem;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.03);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            transition: all 0.3s ease;
            outline: none;
        }

        .edu-input:focus {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .edu-input::placeholder {
            color: #52525b;
        }

        .input-group-edu {
            position: relative;
            display: flex;
            align-items: center;
        }

        .toggle-pw {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: #a1a1aa;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-pw:hover {
            color: var(--text-color);
        }

        .toggle-pw i {
            font-size: 1.2rem;
        }

        .btn-reset {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 0.75rem;
            background: var(--primary-gradient);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
            margin-top: 1rem;
        }

        .btn-reset:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 0.75rem;
            padding: 0.85rem 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .icon-shield {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .icon-shield i {
            font-size: 1.8rem;
            color: #22c55e;
        }

        .password-strength {
            margin-top: 8px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
            transition: all 0.3s;
        }

        .password-strength .bar {
            height: 100%;
            border-radius: 2px;
            transition: all 0.3s;
            width: 0%;
        }

        .strength-text {
            font-size: 0.72rem;
            margin-top: 4px;
            color: #a1a1aa;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="reset-card">
        <div class="brand-logo">
            <img src="{{ url_for('static', filename='img/logo_kolegium.png') }}" alt="Logo Kolegium" style="width: 48px; height: 48px; object-fit: contain;">
            <span>Kolegium</span>
        </div>

        <div class="icon-shield">
            <i class="ph-bold ph-shield-check"></i>
        </div>

        <h2>Nueva Contraseña</h2>
        <p class="subtitle">Ingresa tu nueva contraseña. Asegúrate de que sea segura y fácil de recordar.</p>

        {% if error %}
        <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.restablecer', token=token) }}">
            <div class="mb-3">
                <label class="field-label">Nueva Contraseña</label>
                <div class="input-group-edu">
                    <input type="password" name="password" id="passwordInput" class="edu-input" placeholder="Mínimo 6 caracteres" required minlength="6">
                    <button class="toggle-pw" type="button" onclick="toggleField('passwordInput', this)" title="Mostrar contraseña">
                        <i class="ph-bold ph-eye"></i>
                    </button>
                </div>
                <div class="password-strength" id="strengthBar">
                    <div class="bar" id="strengthFill"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>

            <div class="mb-4">
                <label class="field-label">Confirmar Contraseña</label>
                <div class="input-group-edu">
                    <input type="password" name="confirmar_password" id="confirmInput" class="edu-input" placeholder="Repite tu contraseña" required minlength="6">
                    <button class="toggle-pw" type="button" onclick="toggleField('confirmInput', this)" title="Mostrar contraseña">
                        <i class="ph-bold ph-eye"></i>
                    </button>
                </div>
                <div id="matchMessage" style="font-size: 0.72rem; margin-top: 4px; color: #a1a1aa;"></div>
            </div>

            <button type="submit" class="btn-reset" id="submitBtn">
                <i class="ph-bold ph-check-circle"></i> Guardar nueva contraseña
            </button>
        </form>
    </div>

    <script>
        function toggleField(fieldId, btn) {
            const input = document.getElementById(fieldId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('ph-eye');
                icon.classList.add('ph-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('ph-eye-slash');
                icon.classList.add('ph-eye');
            }
        }

        // Password strength indicator
        const passwordInput = document.getElementById('passwordInput');
        const confirmInput = document.getElementById('confirmInput');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        const matchMessage = document.getElementById('matchMessage');

        passwordInput.addEventListener('input', function() {
            const val = this.value;
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const colors = ['#ef4444', '#f59e0b', '#f59e0b', '#22c55e', '#22c55e'];
            const labels = ['Débil', 'Regular', 'Aceptable', 'Fuerte', 'Muy fuerte'];
            
            if (val.length === 0) {
                strengthFill.style.width = '0%';
                strengthText.textContent = '';
            } else {
                const idx = Math.min(score, 4);
                strengthFill.style.width = ((score / 5) * 100) + '%';
                strengthFill.style.backgroundColor = colors[idx];
                strengthText.textContent = labels[idx];
                strengthText.style.color = colors[idx];
            }
            checkMatch();
        });

        confirmInput.addEventListener('input', checkMatch);

        function checkMatch() {
            const pw = passwordInput.value;
            const cpw = confirmInput.value;
            if (cpw.length === 0) {
                matchMessage.textContent = '';
            } else if (pw === cpw) {
                matchMessage.textContent = '✓ Las contraseñas coinciden';
                matchMessage.style.color = '#22c55e';
            } else {
                matchMessage.textContent = '✗ Las contraseñas no coinciden';
                matchMessage.style.color = '#ef4444';
            }
        }
    </script>

</body>
</html>
